<ul class="horizontal-list">
  {% for item in include.collection %}

    <li class="card">
      <a class="header" href="{{ item.url }}">{{ item.title }}</a>
      <div>
        {% if item.highlight %}
          <mark>{{ item.highlight }}</mark>
        {% endif %}
      </div>

      <hr />

      {% if item.desc != false %}
        <p class="body">
          {{ item.desc }}
        </p>
      {% endif %}
    </li>

  {% endfor %}
</ul>

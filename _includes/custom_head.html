{% if page.layout == "home" and site.theme_config.show_projects and site.data.home.featured_project %}
  <style>
    .card.featured-project {
      width: auto;
      margin-block: 1.25rem 2rem;
      padding: clamp(1.125rem, 4vw, 2rem);
      text-align: start;
    }

    .featured-project mark {
      box-decoration-break: clone;
      -webkit-box-decoration-break: clone;
    }

    .featured-project h3 {
      font-size: clamp(1.75rem, 5vw, 2.5rem);
      line-height: 1.15;
      margin: 0 0 0.75rem;
    }

    .featured-project a {
      text-decoration: underline;
      text-underline-offset: 0.15em;
    }
  </style>
{% endif %}

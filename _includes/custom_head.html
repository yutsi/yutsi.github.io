{% if page.layout == "home" %}
  <style>
    .card a > .header {
      text-decoration: underline;
      text-underline-offset: 0.15em;
    }

    .card.featured-project {
      width: auto;
      margin-block: 1.25rem 2rem;
      padding: clamp(1.125rem, 4vw, 2rem);
      text-align: start;
    }

    .featured-project mark {
      box-decoration-break: clone;
      -webkit-box-decoration-break: clone;
    }

    .featured-project h3 {
      font-size: clamp(1.75rem, 5vw, 2.5rem);
      line-height: 1.15;
      margin: 0 0 0.75rem;
    }

    .featured-project-links {
      display: flex;
      align-items: center;
      flex-wrap: wrap;
      gap: 0.5rem 1rem;
    }

    .project-github {
      display: inline-grid;
      place-items: center;
      min-inline-size: 2rem;
      min-block-size: 2rem;
    }

    .project-github img {
      display: block;
      width: 1.5rem;
      height: auto;
      margin: 0;
    }

    .project-github .github-icon-dark,
    [data-theme="dark"] .project-github .github-icon-light {
      display: none;
    }

    [data-theme="dark"] .project-github .github-icon-dark {
      display: block;
    }

    .featured-project a {
      text-decoration: underline;
      text-underline-offset: 0.15em;
    }
  </style>
{% endif %}

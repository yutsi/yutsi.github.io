{% if page.layout == "home" and site.theme_config.show_projects and site.data.home.featured_project %}
  <style>
    .featured-project {
      border: 1px solid currentColor;
      border-inline-start-width: 0.375rem;
      border-radius: 0.5rem;
      margin-block: 1.25rem 2rem;
      padding: clamp(1.125rem, 4vw, 2rem);
    }

    .featured-project .featured-project-label {
      font-size: 0.875rem;
      font-weight: 700;
      letter-spacing: 0.06em;
      margin: 0;
      text-transform: uppercase;
    }

    .featured-project h3 {
      font-size: clamp(1.75rem, 5vw, 2.5rem);
      line-height: 1.15;
      margin: 0.35rem 0 0.75rem;
    }

    .featured-project a {
      text-decoration: underline;
      text-underline-offset: 0.15em;
    }
  </style>
{% endif %}
